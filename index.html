<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NSE F&amp;O Dashboard</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1a1a1a; background: #ffffff; font-size: 13px; }
  .header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid #e5e7eb; background: #fafbfc; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .meta { color: #6b7280; font-size: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 10; }
  #search { flex: 0 0 240px; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; }
  #search:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
  .range-controls { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #4b5563; flex-wrap: wrap; }
  .range-controls input[type="date"] { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; font-family: inherit; }
  .range-controls .quick { padding: 4px 9px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; font-size: 11px; cursor: pointer; }
  .range-controls .quick:hover { background: #e5e7eb; }
  .range-controls .clear { padding: 4px 9px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 4px; color: #b91c1c; font-size: 11px; cursor: pointer; }
  .pill { background: #eef2ff; color: #3730a3; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; }
  .table-wrap { padding: 0 20px 20px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  thead th { position: sticky; top: 49px; background: #f9fafb; text-align: right; font-weight: 600; font-size: 11px; color: #4b5563; text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 10px; border-bottom: 2px solid #e5e7eb; cursor: pointer; user-select: none; white-space: nowrap; }
  thead th:first-child { text-align: left; }
  thead th:hover { background: #f3f4f6; color: #111827; }
  thead th .arrow { display: inline-block; width: 10px; opacity: 0.4; margin-left: 3px; }
  thead th.sorted .arrow { opacity: 1; color: #2563eb; }
  thead th.range-col { background: #fef9c3; color: #713f12; }
  thead th.range-col.sorted { background: #fef08a; }
  tbody td { padding: 7px 10px; border-bottom: 1px solid #f3f4f6; text-align: right; white-space: nowrap; }
  tbody td:first-child { text-align: left; font-weight: 600; color: #111827; }
  tbody td.range-col { background: #fefce8; }
  tbody tr:hover td { background: #f9fafb; }
  tbody tr:hover td.range-col { background: #fef9c3; }
  .pos { color: #047857; }
  .neg { color: #b91c1c; }
  .zero { color: #6b7280; }
  .strong-pos { color: #047857; font-weight: 600; }
  .strong-neg { color: #b91c1c; font-weight: 600; }
  .na { color: #9ca3af; }
  .footer { padding: 12px 20px; color: #6b7280; font-size: 11px; border-top: 1px solid #f3f4f6; }
  .loading, .error { padding: 40px 20px; text-align: center; color: #6b7280; }
  .error { color: #b91c1c; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>NSE F&amp;O Dashboard</h1>
    <div class="meta" id="meta">Loading&hellip;</div>
  </div>
  <div><span class="pill" id="count-pill">…</span></div>
</div>

<div class="toolbar">
  <input id="search" type="search" placeholder="Filter by symbol&hellip;" disabled />
  <div class="range-controls">
    <span><b>Range:</b></span>
    <input type="date" id="range-from" disabled />
    <span>to</span>
    <input type="date" id="range-to" disabled />
    <button class="quick" data-days="7">1W</button>
    <button class="quick" data-days="30">1M</button>
    <button class="quick" data-days="90">3M</button>
    <button class="quick" data-days="180">6M</button>
    <button class="quick" data-days="365">1Y</button>
    <button class="clear" id="range-clear">Clear</button>
  </div>
  <span class="meta" id="filter-info"></span>
</div>

<div class="table-wrap">
<table id="grid">
  <thead>
    <tr>
      <th data-key="s" data-type="str">Symbol<span class="arrow"></span></th>
      <th data-key="p" data-type="num">Price (&#8377;)<span class="arrow"></span></th>
      <th data-key="m" data-type="num">M-Cap (&#8377; Cr)<span class="arrow"></span></th>
      <th data-key="r" data-type="num" class="range-col hidden">Range %<span class="arrow"></span></th>
      <th data-key="d1" data-type="num">1D %<span class="arrow"></span></th>
      <th data-key="w1" data-type="num">1W %<span class="arrow"></span></th>
      <th data-key="m1" data-type="num">1M %<span class="arrow"></span></th>
      <th data-key="y1" data-type="num">1Y %<span class="arrow"></span></th>
      <th data-key="h" data-type="num">From 52W High %<span class="arrow"></span></th>
    </tr>
  </thead>
  <tbody id="body"><tr><td colspan="9" class="loading">Loading snapshot&hellip;</td></tr></tbody>
</table>
</div>

<div class="footer" id="footer"></div>

<script>
function fmtPrice(v) { if (v == null) return '<span class="na">—</span>'; return v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtMcap(v) { if (v == null) return '<span class="na">—</span>'; return Math.round(v).toLocaleString('en-IN'); }
function fmtPct(v) {
  if (v == null) return '<span class="na">—</span>';
  let cls = 'zero';
  if (v > 0.001) cls = Math.abs(v) >= 5 ? 'strong-pos' : 'pos';
  else if (v < -0.001) cls = Math.abs(v) >= 5 ? 'strong-neg' : 'neg';
  return `<span class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
}
function fmt52wHigh(v) {
  if (v == null) return '<span class="na">—</span>';
  let cls = 'neg';
  if (v >= -2) cls = 'strong-pos';
  else if (v >= -10) cls = 'pos';
  else if (v <= -30) cls = 'strong-neg';
  return `<span class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
}

let SNAP = null, rows = [], dates = [];
let sortKey = 'd1', sortDir = 'desc', sortType = 'num';
let rangeFrom = null, rangeTo = null;
let rangeFromIdx = null, rangeToIdx = null;
let rangeFromDateActual = null, rangeToDateActual = null;

function findIdxAtOrBefore(d) { let lo=0, hi=dates.length-1, ans=-1; while (lo<=hi) { const m=(lo+hi)>>1; if (dates[m]<=d) { ans=m; lo=m+1; } else hi=m-1; } return ans; }
function findIdxAtOrAfter(d)  { let lo=0, hi=dates.length-1, ans=-1; while (lo<=hi) { const m=(lo+hi)>>1; if (dates[m]>=d) { ans=m; hi=m-1; } else lo=m+1; } return ans; }

function recomputeRange() {
  if (!rangeFrom || !rangeTo) { rangeFromIdx = rangeToIdx = null; return; }
  rangeFromIdx = findIdxAtOrAfter(rangeFrom);
  rangeToIdx   = findIdxAtOrBefore(rangeTo);
  rangeFromDateActual = rangeFromIdx >= 0 ? dates[rangeFromIdx] : null;
  rangeToDateActual   = rangeToIdx   >= 0 ? dates[rangeToIdx]   : null;
  if (rangeFromIdx == null || rangeToIdx == null || rangeFromIdx > rangeToIdx) {
    rangeFromIdx = rangeToIdx = null;
  }
  for (const row of rows) {
    if (rangeFromIdx == null) { row.r = null; continue; }
    const sc = row.c[rangeFromIdx], ec = row.c[rangeToIdx];
    row.r = (sc && ec) ? +((ec / sc - 1) * 100).toFixed(2) : null;
  }
}

function compare(a, b) {
  const av = a[sortKey], bv = b[sortKey];
  if (av == null && bv == null) return 0;
  if (av == null) return 1;
  if (bv == null) return -1;
  if (sortType === 'str') { const r = av.localeCompare(bv); return sortDir === 'asc' ? r : -r; }
  return sortDir === 'asc' ? av - bv : bv - av;
}

function renderRows(data, showRange) {
  const body = document.getElementById('body');
  body.innerHTML = data.map(r => {
    const rangeCell = showRange ? `<td class="range-col">${fmtPct(r.r)}</td>` : '';
    return `<tr><td>${r.s}</td><td>${fmtPrice(r.p)}</td><td>${fmtMcap(r.m)}</td>${rangeCell}<td>${fmtPct(r.d1)}</td><td>${fmtPct(r.w1)}</td><td>${fmtPct(r.m1)}</td><td>${fmtPct(r.y1)}</td><td>${fmt52wHigh(r.h)}</td></tr>`;
  }).join('');
}

function render() {
  const filter = document.getElementById('search').value.trim().toUpperCase();
  let data = rows.slice();
  if (filter) data = data.filter(r => r.s.includes(filter));
  data.sort(compare);

  const showRange = rangeFromIdx != null;
  document.querySelectorAll('.range-col').forEach(el => el.classList.toggle('hidden', !showRange));
  renderRows(data, showRange);

  document.getElementById('count-pill').textContent = `${data.length} stocks`;
  let info = filter ? `(filtered from ${rows.length})` : '';
  if (showRange && rangeFromDateActual && rangeToDateActual) {
    const fmt = d => new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
    info = `Range: ${fmt(rangeFromDateActual)} → ${fmt(rangeToDateActual)}` + (filter ? ` · ${info}` : '');
  }
  document.getElementById('filter-info').textContent = info;

  document.querySelectorAll('thead th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === sortKey);
    const arrow = th.querySelector('.arrow');
    arrow.textContent = th.dataset.key === sortKey ? (sortDir === 'asc' ? '▲' : '▼') : '↕';
  });
}

function applyRange() {
  rangeFrom = document.getElementById('range-from').value || null;
  rangeTo   = document.getElementById('range-to').value || null;
  recomputeRange();
  if (rangeFromIdx != null && sortKey !== 'r') { sortKey = 'r'; sortType = 'num'; sortDir = 'desc'; }
  render();
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key, type = th.dataset.type || 'num';
    if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortKey = key; sortType = type; sortDir = type === 'str' ? 'asc' : 'desc'; }
    render();
  });
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('range-from').addEventListener('change', applyRange);
document.getElementById('range-to').addEventListener('change', applyRange);
document.getElementById('range-clear').addEventListener('click', () => {
  document.getElementById('range-from').value = '';
  document.getElementById('range-to').value = '';
  rangeFrom = rangeTo = null;
  rangeFromIdx = rangeToIdx = null;
  if (sortKey === 'r') { sortKey = 'd1'; sortDir = 'desc'; sortType = 'num'; }
  for (const r of rows) r.r = null;
  render();
});
document.querySelectorAll('.quick').forEach(btn => {
  btn.addEventListener('click', () => {
    const days = parseInt(btn.dataset.days, 10);
    const last = dates[dates.length - 1];
    const fromDate = new Date(last);
    fromDate.setDate(fromDate.getDate() - days);
    document.getElementById('range-from').value = fromDate.toISOString().slice(0, 10);
    document.getElementById('range-to').value = last;
    applyRange();
  });
});

fetch('snapshot.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(snap => {
    SNAP = snap;
    rows = snap.rows.slice();
    dates = snap.trading_days || [];
    const fetched = new Date(snap.fetched_at);
    const fetchedStr = fetched.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Kolkata' });
    document.getElementById('meta').textContent =
      `Snapshot from Yahoo Finance · ${fetchedStr} IST · ${dates.length} trading days of history`;
    document.getElementById('search').disabled = false;
    const fromEl = document.getElementById('range-from'), toEl = document.getElementById('range-to');
    if (dates.length) {
      fromEl.min = toEl.min = dates[0];
      fromEl.max = toEl.max = dates[dates.length - 1];
    }
    fromEl.disabled = toEl.disabled = false;
    document.getElementById('footer').innerHTML =
      `Pick a custom date range above (or use a quick button) to compute returns between any two dates. ` +
      `Returns are based on daily closes; the dashboard snaps to the nearest trading day for weekends/holidays. ` +
      `Click any column header to sort.`;
    render();
  })
  .catch(err => {
    document.getElementById('body').innerHTML =
      `<tr><td colspan="9" class="error">Failed to load snapshot.json — ${err.message}</td></tr>`;
    document.getElementById('meta').textContent = 'Error loading data';
  });
</script>
</body>
</html>
