name: Refresh F&O snapshot

on:
  schedule:
    # All times in UTC (IST = UTC + 5:30).
    # Market hours: 09:15 - 15:30 IST (= 03:45 - 10:00 UTC), Mon-Fri.
    - cron: '45 3 * * 1-5'        # 09:15 IST  - market open
    - cron: '*/15 4-9 * * 1-5'    # 09:30 - 15:45 IST every 15 min
    - cron: '0 10 * * 1-5'        # 15:30 IST  - market close
    - cron: '0 11 * * 1-5'        # 16:30 IST  - final settlement capture
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch snapshot
        run: python scripts/fetch_fno_snapshot.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain snapshot.json)" ]]; then
            git add snapshot.json
            git commit -m "Refresh snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No changes to snapshot."
          fi
